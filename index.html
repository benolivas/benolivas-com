<body>
<div id="app">

  <!-- POST-IT — in normal flow, scrolls with page -->
  <div id="logo-wrap">
    <img id="site-logo"
      src="https://benolivas.com/images/BenOlivasLogo3.png"
      alt="Ben Olivas">
  </div>

  <!-- HEADER — pushed down so post-it clips only "Creative" -->
  <header id="header">
    <nav class="header-nav">
      <a href="https://benolivas.com/portfolio" target="_blank" rel="noopener">Portfolio PDF ↗</a>
      <a href="#" id="contact-trigger">Contact</a>
    </nav>
  </header>

  <!-- CONTACT POPUP -->
  <div id="contact-popup" class="contact-popup" aria-hidden="true">
    <div class="contact-popup-inner">
      <a href="/cdn-cgi/l/email-protection#0163646f6e6d6877607241666c60686d2f626e6c"><span class="__cf_email__" data-cfemail="96f4f3f8f9faffe0f7e5d6f1fbf7fffab8f5f9fb">[email&#160;protected]</span></a>
      <a href="https://www.linkedin.com/in/benolivas" target="_blank" rel="noopener">LinkedIn ↗</a>
      <a href="https://www.behance.net/benolivas" target="_blank" rel="noopener">Behance ↗</a>
    </div>
  </div>

  <div class="rule-line"></div>

  <div class="header-sub">Creative Producer · Graphic Designer · Los Angeles</div>

  <!-- CHAT — grows here -->
  <main id="chat-window"></main>

  <!-- INPUT — sticky to bottom once chat fills viewport -->
  <div id="input-area">
    <div class="input-wrap">
      <span class="input-prompt">BEN OS ›</span>
      <textarea
        id="user-input"
        placeholder="What do you need made?"
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="send-btn" aria-label="Send">↵</button>
    </div>
    <div class="input-meta">
      <span id="status-label"></span>
      <span class="input-hint">shift+enter for new line</span>
    </div>
  </div>

  <!-- SUGGESTION BUTTONS — below input, fade in slowly -->
