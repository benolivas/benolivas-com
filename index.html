<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ben Olivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- POST-IT LOGO -->
  <div id="logo-wrap">
    <img id="site-logo"
      src="./assets/logo/BenOlivasLogo3.png"
      alt="Ben Olivas">
  </div>

  <!-- HEADER -->
  <header id="header">
    <nav class="header-nav">
      <a href="https://benolivas.com/portfolio" target="_blank" rel="noopener">Portfolio PDF ↗</a>
      <a href="#" id="contact-trigger">Contact</a>
    </nav>
  </header>

  <!-- CONTACT POPUP -->
  <div id="contact-popup" class="contact-popup" aria-hidden="true">
    <div class="contact-popup-inner">
      <a href="mailto:benolivas@gmail.com">benolivas@gmail.com</a>
      <a href="https://www.linkedin.com/in/benolivas" target="_blank" rel="noopener">LinkedIn ↗</a>
      <a href="https://www.behance.net/benolivas" target="_blank" rel="noopener">Behance ↗</a>
    </div>
  </div>

  <div class="rule-line"></div>

  <div class="header-sub">Creative Producer · Graphic Designer · Los Angeles</div>

  <!-- CHAT -->
  <main id="chat-window"></main>

  <!-- INPUT -->
  <div id="input-area">
    <div class="input-wrap">
      <span class="input-prompt">BEN OS ›</span>
      <textarea
        id="user-input"
        placeholder="Ask me something."
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="send-btn" aria-label="Send">↵</button>
    </div>
    <div class="input-meta">
      <span id="status-label"></span>
      <span class="input-hint">shift+enter for new line</span>
    </div>
  </div>

  <!-- SUGGESTION DOORS -->
  <div id="idle-doors" class="idle-doors"></div>

  <div class="page-end-pad"></div>

</div>

<div id="watermark">BEN OS v2.2</div>

<script src="chat.js"></script>
</body>
</html>
